<!DOCTYPE html>
<html>
<head>
    <title>Frame Structure</title>
</head>

<!-- Top + Remaining -->
<frameset rows="20%,80%">

    <!-- Frame 1 -->
    <frame src="1.html">

    <!-- Bottom divided into 3 columns -->
    <frameset cols="33%,34%,33%">

        <!-- Column 1 (Frames 2,3,4) -->
        <frameset rows="33%,34%,33%">
            <frame src="2.html">
            <frame src="3.html">
            <frame src="4.html">
        </frameset>

        <!-- Column 2 (Frames 5,6,7) -->
        <frameset rows="33%,34%,33%">
            <frame src="5.html">
            <frame src="6.html">
            <frame src="7.html">
        </frameset>

        <!-- Column 3 (Frames 8,9,10) -->
        <frameset rows="33%,34%,33%">
            <frame src="8.html">
            <frame src="9.html">
            <frame src="10.html">
        </frameset>

    </frameset>

</frameset>

</html>

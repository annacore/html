<!DOCTYPE html>
<html>
<head>
    <title>Image Mapping Example</title>
</head>
<body>
<h2>Workspace Image Map</h2>
<img src="images/download3.jpg" 
     alt="Desk Setup"
     usemap="#deskmap"
     width="600">
<map name="deskmap">
    <area shape="rect"
          coords="0,15,175,262"
          href="computer.html"
          alt="Laptop">
    <area shape="rect"
          coords="260,220,360,350"
          href="phone.html"
          alt="Phone">
    <area shape="rect"
          coords="223,74,391,143"
          href="notebook.html"
          alt="Notebook">
    <area shape="circle"
          coords="283,154,68"
          href="coffee.html"
          alt="Coffee">

</map>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength</title>

<script>
function checkPass()
{
    let pwd = document.getElementById('pwd').value;
    let plen = pwd.length;

    if(plen < 6){
        document.getElementById('err').style.color = "red";
        document.getElementById('err').innerHTML = "Password is weak";
    }
    else if(plen >= 6 && plen < 9){
        document.getElementById('err').style.color = "orange";
        document.getElementById('err').innerHTML = "Password is medium";
    }
    else{
        document.getElementById('err').style.color = "green";
        document.getElementById('err').innerHTML = "Password is strong";
    }
}
function showPassword()
{
    let pwd = document.getElementById("pwd");
    let check = document.getElementById("show");
    let label = document.getElementById("lbl");
    if(check.checked){
        pwd.type = "text";
        label.innerHTML = "Hide";
    }
    else{
        pwd.type = "password";
        label.innerHTML = "Show";
    }
}
</script>
</head>
<body>
<form name="frm">
Enter Your Password:
<input type="password" name="pwd" id="pwd" onkeyup="checkPass()">
<span id="err"></span>
<br><br>
<input type="checkbox" id="show" onclick="showPassword()">
<label id="lbl">Show </label>
</form>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Gallery with Next/Prev</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        .gallery {
            width: 400px;
            margin: 50px auto;
            position: relative;
        }

        img {
            width: 100%;
            height: 250px;
            border-radius: 10px;
        }

        button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding: 10px;
            background-color: rgba(0,0,0,0.6);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }

        button:hover {
            background-color: rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<h2>Image Gallery</h2>

<div class="gallery">
    <button class="prev" onclick="prevImage()">❮</button>
    <img id="galleryImage" src="images/bus.jpeg">

    <button class="next" onclick="nextImage()">❯</button>
</div>

<script>
    const images = [
        "https://via.placeholder.com/400x250?text=Image+1",
        "https://via.placeholder.com/400x250?text=Image+2",
        "https://via.placeholder.com/400x250?text=Image+3"
    ];

    let index = 0;

    function showImage() {
        document.getElementById("galleryImage").src = images[index];
    }

    function nextImage() {
        index = (index + 1) % images.length;
        showImage();
    }

    function prevImage() {
        index = (index - 1 + images.length) % images.length;
        showImage();
    }
</script>

</body>
</html>
